[project]
name = "planarity-testing"
version = "0.1.1"
description = "Determines whether an undirected graph is planar and, if so, returns a planar embedding using the Boyer-Myrvold algorithm."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
